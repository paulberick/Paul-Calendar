<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Paul's Calendar</title>

<link rel="manifest" href="manifest.json">

<link rel="stylesheet"
      href="styles.css">

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

</head>

<!-- ==========================================
     ABOUT MODAL
=========================================== -->

<div id="aboutModal" class="aboutModal hidden">

    <div class="aboutContent">

<button id="closeAbout"
        class="closeBook">

    ← Return to the Calendar

</button>

<div id="aboutPages" class="aboutPages">

</div>

<div class="aboutNavigation">

    <button
        id="previousPage"
        class="pageArrow">

        ◀

    </button>

    <div id="pageIndicator">

        Page 1 of 8

    </div>

    <button
        id="nextPage"
        class="pageArrow">

        ▶

    </button>

</div>

    </div>

</div>

<body>

<div id="app">

    <header class="topHeader">

        <div class="titleBlock">

            <h1>☀ Paul's Calendar</h1>

            <div id="gregorianDate"
                 class="gregorianDate">
                Loading...
            </div>

        </div>

    </header>


    <main class="dashboard">

<section class="card solarCard">

    <div class="coordinateLabel">

        Year

    </div>

    <div id="solarYear"
         class="coordinateValue">

        2026

    </div>

    <div class="coordinateLabel">

        Day

    </div>

    <div id="solarDay"
         class="coordinateValue">

        103

    </div>

    <div class="coordinateLabel">

        Moon

    </div>

    <div id="solarMoonNumber"
         class="coordinateMoon">

        Moon Four

    </div>

    <hr>

    <div id="weekday"
         class="weekdayTitle">

        Dreamday,

    </div>

    <div id="quatrainDay"
         class="quatrainDay">

        The Nineteenth Day<br>
        of Quatrain Four

    </div>

</section>
        <section class="card moonCard">

            <div id="moonIcon"
                 class="moonIcon">

                🌕

            </div>

            <div id="moonName"
                 class="moonName">

                Loading...

            </div>

            <div id="moonNumber">

                Moon --

            </div>

            <hr>

<div id="moonPhrase"
     class="moonPhrase">

    Night Two
    <br>
    of the Water Moon

</div>

        
        </section>

        <section class="card astronomyCard">

            <h2>Astronomy</h2>

<div class="event">
    <span>Next Full Moon</span>
    <span id="nextFullMoon">--</span>
</div>

<div class="event">
    <span>Next Equinox</span>
    <span id="nextEquinox">--</span>
</div>

<div class="event">
    <span>Next Eclipse</span>
    <span id="nextEclipse">Coming Soon</span>
</div>


        </section>

        <section class="card navigationCard">

            <button id="previousDay">

                ◀ Previous

            </button>

            <button id="todayButton">

                Today

            </button>

            <button id="nextDay">

                Next ▶

            </button>

        </section>


        <section class="card menuCard">

            <button id="aboutButton">

                About This Calendar

            </button>

            <button id="exportButton">

                Export Calendar

            </button>

            <button id="settingsButton">

                Settings

            </button>

        </section>

    </main>

</div>

<script type="module" src="app.js"></script>

</body>

</html>
